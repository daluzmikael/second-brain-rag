services:
  db:
    image: pgvector/pgvector:pg16
    container_name: second-brain-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: second_brain
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d second_brain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
